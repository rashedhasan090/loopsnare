[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loopsnare"
version = "0.1.0"
description = "Detect runaway loops in AI agent tool-call traces"
license = {text = "MIT"}
requires-python = ">=3.9"

[project.scripts]
loopsnare = "loopsnare.cli:main"
